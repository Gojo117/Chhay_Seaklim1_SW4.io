<div>
    <h2>Prodcut Information</h2>
    <div>
        <table>
            <thead>
                <tr>
                    <th>PRODUCT ID</th>
                    <th>IMAGE</th>
                    <th>PRODUCT NAME</th>
                    <th>CATEGORY</th>
                    <th>BRAND</th>
                    <th>PRICE($)</th>
                    <th>RATING</th>
                    <th>STOCK</th>
                    <th>ACTION</th>
                </tr>
            </thead>
            <tbody>
                 <tr *ngFor="let item of paginationProduct">
                     <td>{{item.id}}</td>
                     <td><img [src]="item.thumbnail" alt="" width="70px" height="70px"></td>  
                     <td>{{item.title}}</td>  
                    <td>{{item.category}}</td>
                    <td>{{item.brand}}</td>
                    <td>${{item.price}}</td>
                    <td>{{item.rating}}/5</td>
                    <td>{{item.stock}} Units</td>
                    <td>
                            <button class=" btn btn-warning me-2 "><i class="bi bi-pencil-square "></i> Edit</button>
                            <button class="btn  btn-danger"><i class="bi bi-trash"></i> Delete</button>
                    </td>
                    </tr>
                   
            </tbody>
        </table>
    </div>
    
    <div class="d-flex justify-content-center align-items-center mt-4">
    
        <button
            class="btn btn-outline-primary me-2"
            (click)="firstPage()"
            [disabled]="currentPage === 1">
            <i class="bi bi-chevron-double-left"></i>
            First
        </button>
    
        <button
            class="btn btn-outline-secondary me-3"
            (click)="previousPage()"
            [disabled]="currentPage === 1">
            <i class="bi bi-chevron-left"></i>
            Previous
        </button>
    
        <span class="fw-bold fs-5">
            Page {{ currentPage }} of {{ totalPages }}
        </span>
    
        <button
            class="btn btn-outline-secondary ms-3 me-2"
            (click)="nextPage()"
            [disabled]="currentPage === totalPages">
            Next
            <i class="bi bi-chevron-right"></i>
        </button>
    
        <button
            class="btn btn-outline-primary"
            (click)="lastPage()"
            [disabled]="currentPage === totalPages">
            Last
            <i class="bi bi-chevron-double-right"></i>
        </button>
    
    </div>
</div>
